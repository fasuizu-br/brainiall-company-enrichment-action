name: 'Brainiall Company Enrichment'
description: 'Enrich one company domain with firmographics, technologies, socials, and financial signals through Apify.'
author: 'BRAINIALL Team'

inputs:
  domain:
    description: 'Company domain only, for example openai.com. Do not include a scheme or path.'
    required: true
  apify_token:
    description: 'Scoped Apify API token. Pass it from GitHub Actions secrets; never hard-code it.'
    required: true
  output_path:
    description: 'Output JSON path inside GITHUB_WORKSPACE. Its parent directory must already exist.'
    required: false
    default: 'company-enrichment.json'
  include_technologies:
    description: 'Include detected technology signals: true or false.'
    required: false
    default: 'true'
  include_socials:
    description: 'Include public social profile signals: true or false.'
    required: false
    default: 'true'
  include_financials:
    description: 'Include available financial signals: true or false.'
    required: false
    default: 'true'

outputs:
  output_path:
    description: 'Absolute path of the generated JSON file.'
    value: ${{ steps.enrich.outputs.output_path }}
  result_count:
    description: 'Number of results returned. The action hard-caps this at one.'
    value: ${{ steps.enrich.outputs.result_count }}

runs:
  using: 'composite'
  steps:
    - id: enrich
      name: Enrich company with Brainiall on Apify
      shell: bash
      env:
        BRAINIALL_DOMAIN: ${{ inputs.domain }}
        BRAINIALL_APIFY_TOKEN: ${{ inputs.apify_token }}
        BRAINIALL_OUTPUT_PATH: ${{ inputs.output_path }}
        BRAINIALL_INCLUDE_TECHNOLOGIES: ${{ inputs.include_technologies }}
        BRAINIALL_INCLUDE_SOCIALS: ${{ inputs.include_socials }}
        BRAINIALL_INCLUDE_FINANCIALS: ${{ inputs.include_financials }}
      run: '"${GITHUB_ACTION_PATH}/scripts/enrich.sh"'

branding:
  icon: 'briefcase'
  color: 'blue'
